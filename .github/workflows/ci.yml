name: Validate and build Android debug
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm run android:sync
        env:
          NEXOCENA_APP_URL: ${{ vars.NEXOCENA_APP_URL }}
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --max-workers=2
        working-directory: apps/android/android
      - run: sha256sum apps/android/android/app/build/outputs/apk/debug/app-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nexocena-debug
          path: |
            apps/android/android/app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
