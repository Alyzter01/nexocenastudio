name: Validate web studio
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: nexocena_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/nexocena_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/init-test-postgres.mjs
        env:
          NODE_ENV: test
      - run: npm run db:migrate
        env:
          NODE_ENV: test
          DATABASE_SSL: "false"
          DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/nexocena_ci_test
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: nexocena-web
          path: |
            apps/web/dist
            dist/server
