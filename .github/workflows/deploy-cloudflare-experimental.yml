name: Deploy NEXOCENA experimental Worker (manual)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite DEPLOY-EXPERIMENTAL para publicar somente o Worker experimental'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nexocena-worker-experimental-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY-EXPERIMENTAL' && github.ref == 'refs/heads/experiment/cloudflare-pages-workers-d1' }}
    runs-on: ubuntu-latest
    environment: cloudflare-experimental
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure CLOUDFLARE_API_TOKEN in GitHub environment cloudflare-experimental'; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = '6912631438e599ad7186d54a81f64640' || { echo 'Configure the correct CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - run: npm ci
      - run: npm run typecheck:worker
      - run: npm run test:worker
      - run: npm run test:workerd
      - name: Verify D1 schema without applying migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute nexocena-experimental --remote --config apps/worker/wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE name IN ('users','sessions','projects','project_versions','auth_throttles','flow_credit_ledgers') ORDER BY name;"
      - name: Deploy experimental API only (do not enable remote access)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/worker/wrangler.jsonc --keep-vars
      - name: Verify deployed health and fail-closed guard
        run: |
          node --input-type=module <<'NODE'
          const base='https://nexocena-api-experimental.mkprod-60.workers.dev';
          const health=await fetch(base+'/api/health',{headers:{'cache-control':'no-cache'}});
          const h=await health.json().catch(()=>null);
          if(health.status!==200||h?.api!=='experimental')throw Error('Health check failed: '+health.status);
          const guarded=await fetch(base+'/api/auth/config',{headers:{'cache-control':'no-cache'}});
          if(guarded.status!==503)throw Error('Remote access guard must remain closed; received '+guarded.status);
          console.log('Experimental Worker deployed, health OK, remote access remains disabled.');
          NODE
